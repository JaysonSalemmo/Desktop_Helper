[project]
name = "desktop-helper"
version = "0.1.0"
description = "A Python desktop assistant powered by a from-scratch GPT-style transformer"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "textual>=0.80.0",
    "faster-whisper>=1.2.1",
    "chromadb>=1.5.0",
    "pyobjc>=12.1",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "yfinance>=1.3.0",
    "rumps>=0.4.0",
    "pynput>=1.7.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
